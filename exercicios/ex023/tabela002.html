<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 450px;

            caption{
                background-color: lightgray;
                font-variant: small-caps;
                font-weight: 900;
                font-size: 1.3em;
                padding: 10px;
                vertical-align: center;
                border-radius: 10px 10px 0px 0px;
            }


            thead, tfoot{
                background-color: gray;
                color: white;
            }

            tbody{
                tr:nth-child(2n){
                    background-color: lightgray;
                    position: relative;

                    thead > tr > th{
                        position: sticky;
                        top: 0; 
                    }
                }
            }
            td,
            th {
                border: 1px solid black;
                padding: 5px;
            }  
            
            .numero{
                text-align: right;
            }
        }
    </style>
</head>

<body>

    <table>
        <caption>população das unidade federativas</caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col">População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="numero">45 919 040</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="numero">21 100 791</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="numero">17 264 943</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td class="numero">14 873 064</td>
            </tr>
            <tr>
                <td>Paraná</td>
                <td class="numero">11 433 957</td>
            </tr>
            <tr>
                <td>Rio Grande do Sul</td>
                <td class="numero">11 377 109</td>
            </tr>
            <tr>
                <td>Pernambuco</td>
                <td class="numero">9 557 071</td>
            </tr>
            <tr>
                <td>Ceará</td>
                <td class="numero">9 132 078</td>
            </tr>
            
        </tbody>
        <tfoot>
            <th  scope="row">Total</th>
            <td class="numero">00 000 000</td>
        </tfoot>
    </table>

</body>

</html>

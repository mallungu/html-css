<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formul[ario</title>
</head>

<body>

    <h1>Exemplo de formul[ario</h1>

    <form action="cadastro.js" method="get" autocomplete="on">

        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="mas" checked>
            <label for="mas">Masculino</label> <br>
            <input type="radio" name="sexo" id="fem">
            <label for="fem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esports Favoritos</legend>

            <input type="checkbox" name="fut" id="ifut" checked>
            <label for="ifut">Futebol</label> <br>
            <input type="checkbox" name="bas" id="ibas" checked>
            <label for="ibas">Basquete</label> <br>
            <input type="checkbox" name="nat" id="inat">
            <label for="inat">Natação</label> <br>
            <input type="checkbox" name="ten" id="iten">
            <label for="iten">Tenis</label>
            
        </fieldset>

        <p>
                <input type="reset" value="Limpar">
                <input type="submit" value="Enviar">
            </p>
    </form>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>

    <h1>Exemplo de formulário</h1>

    <form action="cadastro.js" method="get">

        <p>
            <label for="inum">Número</label>
            <input type="range" name="num" id="inum" max="100" min="1" required oninput="isoma.innerHTML = Number(num.value)" value="0">
            <output id="isoma">0</output>
        </p>

        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>
    </form>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>

    <h1>Exemplo de formulário</h1>

    <form action="cadastro.js" method="get">

        <p>
            <label for="in1">Número 1</label>
            <input type="number" name="n1" id="in1" max="100" min="1" required oninput="isoma.innerHTML = Number(n1.value)+ Number(n2.value)">
        </p>
        <p>
            <label for="in2">Número 1</label>
            <input type="number" name="n2" id="in2" max="100" min="1" required oninput="isoma.innerHTML = Number(n1.value)+ Number(n2.value)">
        </p>
        
        <p>
            <label for="isoma">Soma</label>
            <output id="isoma">0</output>
        </p>

        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>
    </form>
    
</body>
</html>

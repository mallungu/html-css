<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>

    <h1>Teste de formulário</h1>

    <form action="cadastro.js" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuário</label>
            <input type="text" name="usu" id="iusu" required minlength="5" maxlength="20" size="20">
        </p>

        <p>
            <label for="isenha">Senha</label>
            <input type="password" name="senha" id="isenha" required minlength="8" maxlength="15" size="20"
                autocomplete="current-password">
        </p>

         <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>


    </form>

</body>

</html>

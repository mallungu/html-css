<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>

    <h1>Exemplo de formulário</h1>

    <form action="cadastro.js" method="get">

        <p>
            <label for="iano">Ano de nascimento </label>
            <input type="number" name="num" id="iano" max="2025" min="1900" required oninput="calcIdade()">
        </p>

        <p>
            <label for="idade">Sua idade é: </label>
            <output id="idade"></output>
        </p>

        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>
    </form>

    <script>
        function calcIdade(){
            let atual = new Date().getFullYear();
            idade.innerHTML = Number(atual) - Number(iano.value);
        }
    </script>
    
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>

    <h1>Teste de formulário</h1>

    <form action="cadastro.js" method="post" autocomplete="on">
        <p>
            <label for="iusu">Nome</label>
            <input type="text" name="usu" id="iusu" required minlength="5" maxlength="20" size="20">
        </p>

        <p>
            <label for="imes">Periodo lectivo</label>
            <input type="month" name="mes" id="imes" value="2025-05">
        </p>

        <p>
            <label for="idata">Data da prova</label>
            <input type="date" name="data" id="idata" value="2025-05-26">
        </p>

        <p>
            <label for="ihora">Hora da prova</label>
            <input type="time" name="hora" id="ihora" value="20:10">
        </p>

        <p>
            <label for="imedia">Media</label>
            <input type="number" name="media" id="imedia"  min="0" max="20" value="5" step="0.1" >
        </p>

        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>

    </form>

</body>

</html>
